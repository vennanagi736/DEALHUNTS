
# ==========================================
# DEAL HUNTS - DATABASE CONFIGURATION
# ==========================================

# Uses Render environment variables when provided.
# Otherwise, connects to your local MySQL database.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/dealhunts}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# SERVER
# ==========================================

server.port=${PORT:8080}

# ==========================================
# JWT SECURITY
# Set JWT_SECRET and JWT_EXPIRATION in Render.
# ==========================================

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

